<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supabase Provider Test - Yjs Real-time Sync</title>

    <!-- Quill CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #3ecf8e 0%, #1a936f 100%);
        min-height: 100vh;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      header {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin: 0 0 10px 0;
        color: #333;
        font-size: 28px;
      }

      .subtitle {
        color: #666;
        font-size: 14px;
        margin: 0 0 15px 0;
      }

      .config-panel {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 15px;
      }

      .config-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 15px;
      }

      .config-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .config-group label {
        font-size: 13px;
        font-weight: 500;
        color: #495057;
      }

      .config-group input {
        padding: 8px 12px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        font-size: 14px;
      }

      .config-group input:focus {
        outline: none;
        border-color: #3ecf8e;
        box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.1);
      }

      .action-buttons {
        display: flex;
        gap: 10px;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-primary {
        background: #3ecf8e;
        color: white;
      }

      .btn-primary:hover {
        background: #2db577;
      }

      .btn-primary:disabled {
        background: #ced4da;
        cursor: not-allowed;
      }

      .btn-danger {
        background: #dc3545;
        color: white;
      }

      .btn-danger:hover {
        background: #c82333;
      }

      .status-bar {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 8px;
        margin-top: 15px;
      }

      .status-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #333;
      }

      .status-indicator {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        transition: all 0.3s;
      }

      .status-indicator.connected {
        background: #4caf50;
        box-shadow: 0 0 8px #4caf50;
      }

      .status-indicator.disconnected {
        background: #f44336;
      }

      .status-indicator.connecting {
        background: #ff9800;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .editor-container {
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .editor-wrapper {
        min-height: 400px;
        padding: 20px;
      }

      #editor {
        min-height: 400px;
      }

      .sidebar {
        background: white;
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .sidebar h3 {
        margin: 0 0 15px 0;
        font-size: 18px;
        color: #333;
      }

      #users-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      #users-list li {
        padding: 8px 0;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }

      .user-color {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .log-container {
        background: white;
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .log-container h3 {
        margin: 0 0 15px 0;
        font-size: 18px;
        color: #333;
      }

      #log {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        padding: 15px;
        max-height: 200px;
        overflow-y: auto;
        font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
        font-size: 12px;
        line-height: 1.6;
      }

      .log-entry {
        margin: 4px 0;
        color: #495057;
      }

      .log-entry .timestamp {
        color: #6c757d;
      }

      .info-box {
        background: #d1ecf1;
        border: 1px solid #bee5eb;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 15px;
        font-size: 14px;
        color: #0c5460;
      }

      .info-box strong {
        display: block;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🗄️ Supabase Provider Test</h1>
        <p class="subtitle">
          Real-time collaborative editing with Supabase Realtime
        </p>

        <div class="info-box">
          <strong>Setup Required:</strong>
          Enter your Supabase project URL and anon key below.
        </div>

        <div class="config-panel">
          <div class="config-row">
            <div class="config-group">
              <label for="supabase-url">Supabase URL</label>
              <input
                type="text"
                id="supabase-url"
                placeholder="https://xxxxx.supabase.co"
              />
            </div>
            <div class="config-group">
              <label for="supabase-key">Supabase Anon Key</label>
              <input
                type="text"
                id="supabase-key"
                placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              />
            </div>
          </div>

          <div class="config-row">
            <div class="config-group">
              <label for="room-name">Room Name</label>
              <input
                type="text"
                id="room-name"
                placeholder="my-collaborative-room"
                value="demo-room"
              />
            </div>
            <div class="config-group">
              <label for="password">Password (optional)</label>
              <input
                type="text"
                id="password"
                placeholder="Leave empty for public room"
              />
            </div>
          </div>

          <div class="action-buttons">
            <button class="btn btn-primary" id="connect-btn">Connect</button>
            <button
              class="btn btn-danger"
              id="disconnect-btn"
              style="display: none"
            >
              Disconnect
            </button>
          </div>
        </div>

        <div class="status-bar">
          <div class="status-item">
            <div
              class="status-indicator disconnected"
              id="connection-status"
            ></div>
            <span id="connection-text">Disconnected</span>
          </div>
          <div class="status-item">
            <span>Room: <strong id="room-text">-</strong></span>
          </div>
          <div class="status-item">
            <span>Synced: <strong id="synced-text">-</strong></span>
          </div>
          <div class="status-item">
            <span>Users: <strong id="user-count">0</strong></span>
          </div>
        </div>
      </header>

      <div class="editor-container">
        <div class="editor-wrapper">
          <div id="editor"></div>
        </div>
      </div>

      <div class="sidebar">
        <h3>👥 Active Users</h3>
        <ul id="users-list">
          <li>Not connected</li>
        </ul>
      </div>

      <div class="log-container">
        <h3>📋 Event Log</h3>
        <div id="log"></div>
      </div>
    </div>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
